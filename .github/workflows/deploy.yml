name: Build and Deploy to GitHub Pages

on:
  push:
    branches: 
      - main
      - dev
  pull_request:
    branches: 
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Initialize Hugo theme submodule
      run: |
        git submodule update --init --remote themes/hugo-coder || {
          echo "Submodule update failed, removing and re-adding..."
          git submodule deinit -f themes/hugo-coder
          rm -rf themes/hugo-coder
          git submodule add https://github.com/luizdepra/hugo-coder.git themes/hugo-coder
          git submodule update --init themes/hugo-coder
        }

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 'latest'
        extended: true

    - name: Build
      run: |
        hugo --minify
        touch public/.nojekyll

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        external_repository: cmarshak/cmarshak.github.io
        publish_branch: main
        publish_dir: ./public
        cname: charlie-marshak.net